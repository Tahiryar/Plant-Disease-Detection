<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result </title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 300px;
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h2 {
      color: #2c3e50;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: white;
      background: #27ae60;
      padding: 10px 20px;
      border-radius: 8px;
    }
    a:hover {
      background: #219150;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ image_path }}" alt="Uploaded Image">
    <h2>Prediction: {{ result }}</h2>
    <a href="/">Try Another</a>
  </div>
</body>
</html>
